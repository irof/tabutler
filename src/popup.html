<!DOCTYPE html>
<html>

<head>

    <link rel="stylesheet" href="./popup.css"/>

</head>

<body>
<div class="main">
    <button id="grouping">グルーピング</button>

</div>
<div class="sub">

</div>

<details open>

    <button id="grouping_rule_save">保存</button>
</details>

<div>
    <button id="sweep_history_update">掃除履歴更新</button>
    <button id="sweep_history_clear">掃除履歴削除</button>

    <template id="swept_template">
        <div>
            <h2>dummy</h2>
            <ul>
                <li><a href="about:blank">dummy</a></li>
            </ul>
        </div>
    </template>
    <div id="sweep_history"></div>
</div>

<script src="./popup.js" type="module"></script>
</body>

</html>
